name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: appchi_migration_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appchi_migration_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
      - name: Locked install and checks
        env:
          APPCHI_MIGRATION_TEST_ADMIN_URL: postgresql://appchi_migration_test@localhost:5432/postgres
        run: |
          uv sync --locked --all-extras
          uv run --locked ruff check src tests
          uv run --locked pytest tests -q
          uv build --wheel
