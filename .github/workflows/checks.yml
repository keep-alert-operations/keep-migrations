name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.8"
      - name: Locked install and checks
        env:
          APPCHI_TOKEN: ${{ secrets.APPCHI_REPOSITORIES_TOKEN }}
        run: |
          uv sync --locked --all-extras
          uv run --locked ruff check src tests
          if [ -d tests/unit ]; then uv run --locked pytest tests/unit -q; fi
          uv build --wheel
