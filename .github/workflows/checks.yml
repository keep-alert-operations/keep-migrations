name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: appchi_migration_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appchi_migration_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: python -m pip install poetry==2.3.1
      - name: Locked install and checks
        env:
          APPCHI_MIGRATION_TEST_ADMIN_URL: postgresql://appchi_migration_test@localhost:5432/postgres
        run: |
          poetry check --lock
          poetry sync --all-extras
          poetry run ruff check src tests
          poetry run pytest tests -q
          poetry build --format wheel
